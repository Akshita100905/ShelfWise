<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShelfWise</title>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="css/style.css">
<script src="js/vendor/chart.umd.min.js"></script>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v10.5a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5V8Z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.7 7.1L4 20l1-4.4A8 8 0 1 1 21 12Z"/><path d="M9 11h.01M13 11h.01M17 11h.01" stroke-width="2.6"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M15.5 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8.5L15.5 3Z"/><path d="M15 3v6h6"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></symbol>
  <symbol id="i-zap" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></symbol>
  <symbol id="i-cart" viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 11.4a1 1 0 0 0 1 .8h8.8a1 1 0 0 0 1-.8L20 7H6"/></symbol>
  <symbol id="i-flask" viewBox="0 0 24 24"><path d="M9 3h6"/><path d="M10 3v6.2L4.6 18a2 2 0 0 0 1.7 3h11.4a2 2 0 0 0 1.7-3L14 9.2V3"/><path d="M7.5 15h9"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="m3 6 1.5 1.5L7.5 4.5"/><path d="m3 13 1.5 1.5L7.5 11.5"/><path d="M11 6h10"/><path d="M11 13h10"/><path d="M3 20h4"/><path d="M11 20h10"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h9"/><path d="M17 6h3"/><circle cx="15" cy="6" r="2"/><path d="M4 12h3"/><path d="M11 12h9"/><circle cx="9" cy="12" r="2"/><path d="M4 18h11"/><path d="M19 18h1"/><circle cx="17" cy="18" r="2"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v6"/><path d="M14 11v6"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12"/><path d="M18 6 6 18"/></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></symbol>
  <symbol id="i-volume-off" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m16 9 5 6"/><path d="m21 9-5 6"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3 10 14"/><path d="m21 3-7 18-4-7-7-4 18-7Z"/></symbol>
  <symbol id="i-house" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7"/><path d="M6 10v9h12v-9"/><path d="M10 19v-5h4v5"/></symbol>
</svg>

<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>

<div class="mobile-topbar">
  <button class="hamburger" onclick="openDrawer()" aria-label="Open menu"><svg class="i" aria-hidden="true"><use href="#i-menu"/></svg></button>
  <img src="assets/logo-mark.png" alt="">
  <strong>ShelfWise</strong>
</div>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="assets/logo-mark.png" alt="ShelfWise">
      <div class="wordmark"><span class="shelf">Shelf</span><span class="wise">Wise</span></div>
    </div>

    <div class="hh-wrap">
      <button class="household-switch" id="householdSwitchBtn" onclick="toggleHouseholdMenu(event)" aria-haspopup="menu" aria-expanded="false">
        <svg class="i" aria-hidden="true"><use href="#i-house"/></svg> <span id="householdNameLabel">My household</span>
        <svg class="i i-sm" aria-hidden="true"><use href="#i-chevron"/></svg>
      </button>
      <div class="hh-menu" id="hhMenu" role="menu"></div>
    </div>

    <div class="nav-section-label">Main</div>
    <button class="nav-item" data-page="home" onclick="navigate('home')"><svg class="i" aria-hidden="true"><use href="#i-home"/></svg> Home</button>
    <button class="nav-item" data-page="inventory" onclick="navigate('inventory')"><svg class="i" aria-hidden="true"><use href="#i-box"/></svg> Inventory</button>
    <button class="nav-item" data-page="chat" onclick="navigate('chat')"><svg class="i" aria-hidden="true"><use href="#i-chat"/></svg> Chat</button>
    <button class="nav-item" data-page="board" onclick="navigate('board')"><svg class="i" aria-hidden="true"><use href="#i-note"/></svg> Board</button>
    <button class="nav-item" data-page="analytics" onclick="navigate('analytics')"><svg class="i" aria-hidden="true"><use href="#i-chart"/></svg> Analytics</button>

    <div class="nav-section-label">Tools</div>
    <button class="nav-item" data-page="use-first" onclick="navigate('use-first')"><svg class="i" aria-hidden="true"><use href="#i-zap"/></svg> Use First</button>
    <button class="nav-item" data-page="dont-buy" onclick="navigate('dont-buy')"><svg class="i" aria-hidden="true"><use href="#i-cart"/></svg> Don't Buy Yet</button>
    <button class="nav-item" data-page="what-if" onclick="navigate('what-if')"><svg class="i" aria-hidden="true"><use href="#i-flask"/></svg> What-If</button>
    <button class="nav-item" data-page="shopping" onclick="navigate('shopping')"><svg class="i" aria-hidden="true"><use href="#i-list"/></svg> Shopping List</button>
    <button class="nav-item" data-page="purchase-history" onclick="navigate('purchase-history')"><svg class="i" aria-hidden="true"><use href="#i-clock"/></svg> Purchase History</button>

    <div class="sidebar-spacer"></div>

    <button class="add-item-btn" onclick="openAddItemModal()"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg> Add item</button>

    <div class="sidebar-user">
      <div class="avatar" id="userAvatar">MC</div>
      <div class="name" id="userNameLabel">—</div>
      <button onclick="navigate('settings')" title="Settings" aria-label="Settings"><svg class="i" aria-hidden="true"><use href="#i-sliders"/></svg></button>
    </div>
  </aside>

  <main class="main" id="main">
    <!-- page content injected by js/app.js router -->
  </main>
</div>

<div class="floating-voice" id="floatingVoice">
  <div class="floating-hint" id="floatingHint">Try: "Add milk to my list" or "What can I cook?"</div>
  <button class="mic-fab" id="micFab" onclick="toggleVoice()" aria-label="Voice assistant"><svg class="i" aria-hidden="true"><use href="#i-mic"/></svg></button>
</div>

<div class="toast" id="toast" role="status"></div>
<div id="modalRoot"></div>

<script src="js/theme.js"></script>
<script src="js/api.js"></script>
<script src="js/ring.js"></script>
<script src="js/pages/home.js"></script>
<script src="js/pages/inventory.js"></script>
<script src="js/pages/additem.js"></script>
<script src="js/pages/chat.js"></script>
<script src="js/pages/board.js"></script>
<script src="js/pages/analytics.js"></script>
<script src="js/pages/tools.js"></script>
<script src="js/pages/lists.js"></script>
<script src="js/pages/settings.js"></script>
<script src="js/pages/household.js"></script>
<script src="js/voice.js"></script>
<script src="js/app.js"></script>
</body>
</html>
